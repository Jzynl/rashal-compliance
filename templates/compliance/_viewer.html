<div class="viewer" id="viewer" onclick="if(event.target===this)rashalCloseViewer()">
  <div class="viewer-bar">
    <button type="button" class="btn solid" onclick="rashalCloseViewer()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" style="width:17px;height:17px">
        <path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      Back
    </button>
    <b id="v-name"></b>
    <span style="flex:1"></span>
    <a id="v-dl" class="btn" href="#">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" style="width:17px;height:17px">
        <path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M4 21h16"/></svg>
      Download
    </a>
    <button type="button" class="btn solid" onclick="rashalCloseViewer()"
            style="background:var(--orange);border-color:var(--orange)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
           stroke-linecap="round" style="width:17px;height:17px">
        <path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
      Close
    </button>
  </div>
  <div class="viewer-body" id="v-body"></div>
  <div class="viewer-foot">
    <button type="button" class="btn solid" onclick="rashalCloseViewer()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" style="width:17px;height:17px">
        <path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      Back to list
    </button>
  </div>
</div>

<style>
  #viewer { display: none; position: fixed; inset: 0; z-index: 9000;
            background: rgba(11,32,20,.82); flex-direction: column; padding: 2.5vh 3vw; }
  #viewer.show { display: flex; }
  #viewer .viewer-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  #viewer .viewer-bar b { color: #fff; font-size: 15px; font-weight: 600; }
  #viewer .viewer-bar .btn { background: #fff; }
  #viewer .viewer-bar .btn.solid { background: var(--green); color: #fff; border-color: var(--green); }
  #viewer .viewer-body { flex: 1; background: #fff; border-radius: 12px; overflow: auto;
                 display: flex; align-items: center; justify-content: center; }
  #viewer .viewer-body iframe { width: 100%; height: 100%; border: 0; }
  #viewer .viewer-body img { max-width: 100%; max-height: 100%; object-fit: contain; }
  #viewer .viewer-foot { display: flex; justify-content: center; margin-top: 12px; }
  #viewer .viewer-foot .btn.solid { background: #fff; color: var(--green); border-color: #fff; }
  @media (max-width: 640px) {
    #viewer { padding: 0; }
    #viewer .viewer-bar { padding: 10px; flex-wrap: wrap; }
    #viewer .viewer-bar b { order: 4; flex-basis: 100%; }
    #viewer .viewer-body { border-radius: 0; }
    #viewer .viewer-foot { padding: 10px; }
  }
</style>

<script>
  function rashalOpenViewer(url, label, isPdf) {
    var v = document.getElementById('viewer');
    var body = document.getElementById('v-body');
    document.getElementById('v-name').textContent = label || '';
    document.getElementById('v-dl').href = url + '?download=1';
    body.innerHTML = '';
    if (isPdf) {
      var f = document.createElement('iframe'); f.src = url; body.appendChild(f);
    } else {
      var img = document.createElement('img'); img.src = url; body.appendChild(img);
    }
    v.classList.add('show');
    document.body.style.overflow = 'hidden';
  }
  function rashalCloseViewer() {
    var v = document.getElementById('viewer');
    v.classList.remove('show');
    document.getElementById('v-body').innerHTML = '';
    document.body.style.overflow = '';
  }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') rashalCloseViewer();
  });
  document.addEventListener('click', function (e) {
    var btn = e.target.closest('.view-doc');
    if (!btn) return;
    e.preventDefault();
    rashalOpenViewer(btn.getAttribute('data-url'),
                     btn.getAttribute('data-name'),
                     btn.getAttribute('data-pdf') === '1');
  });
</script>
